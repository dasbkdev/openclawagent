name: Build desktop agents

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - server

jobs:
  windows:
    name: Windows desktop .exe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: control-plane/desktop-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: control-plane/desktop-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: starlab-openclaw-agent-windows
          path: control-plane/desktop-agent/dist/starlab-openclaw-agent-windows.exe

  macos:
    name: macOS desktop .dmg
    runs-on: macos-latest
    defaults:
      run:
        working-directory: control-plane/desktop-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: control-plane/desktop-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: starlab-openclaw-agent-macos
          path: |
            control-plane/desktop-agent/dist/*.dmg

  linux:
    name: Linux Debian .deb
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane/desktop-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: control-plane/desktop-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Linux app
        run: npm run build:linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: starlab-openclaw-agent-linux
          path: control-plane/desktop-agent/dist/starlab-openclaw-agent-linux-amd64.deb
