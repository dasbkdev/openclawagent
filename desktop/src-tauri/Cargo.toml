[package]
name = "sai-desktop"
version = "0.1.0"
description = "SAI native desktop assistant"
authors = ["SAI"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[features]
# by default Tauri runs in production mode; devtools are on in debug builds
custom-protocol = ["tauri/custom-protocol"]
